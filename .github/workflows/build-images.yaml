name: Build isolated PostHog validation images
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
env:
  VALIDATION_TAG: validation-20261013-1
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image:
        - app
        - node
        - clickhouse
        - storage
        - kafka-init
    steps:
    - name: Free build disk space
      run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
    - name: Read immutable upstream configuration
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: PostHog/posthog
        ref: 588de869d4989164b913b1b5b64bd82835b688de
        path: posthog
        sparse-checkout: 'docker/clickhouse

          docker/kafka

          posthog/idl

          posthog/user_scripts'
        persist-credentials: false
    - name: Prepare minimal wrappers
      run: "python3 - <<'PY'\nimport base64, json, zlib\nfrom pathlib import Path\nfiles = json.loads(zlib.decompress(base64.b64decode(\"\
        \"\
        )))\nfor name, content in files.items():\n    path = Path(name)\n    path.parent.mkdir(parents=True, exist_ok=True)\n\
        \    path.write_text(content)\nPY"
    - name: Log in to GHCR
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
    - name: Build and publish immutable validation tag
      uses: docker/build-push-action@v6
      with:
        context: .
        file: wrappers/${{ matrix.image }}.Dockerfile
        platforms: linux/amd64
        push: true
        tags: ghcr.io/hexatare/posthog-railway-template/${{ matrix.image }}:${{ env.VALIDATION_TAG }}
        labels: 'org.opencontainers.image.source=https://github.com/Hexatare/posthog-railway-template

          org.opencontainers.image.revision=588de869d4989164b913b1b5b64bd82835b688de'
